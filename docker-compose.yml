services:
  myfarm_front:
    build: .
    image: myfarm_front:dev
    container_name: myfarm_front
    profiles: ["dev"]
    env_file:
      - .env.dev
    environment:
      - PYTHONPATH=/app
      - FLASK_ENV=development
      - FLASK_RUN_PORT=8001
      - FLASK_RUN_HOST=0.0.0.0
      - API_URL=http://myfarm_api:8000/   # 👈 IMPORTANT
    command: >
      python -m flask --app main run --host=0.0.0.0 --port=8001
    ports:
      - "8001:8001"
    volumes:
      - ./:/app:rw,delegated
    networks:
      - myfarm_net

networks:
  myfarm_net:
    external: true
